# WireGuard конфигурация для ЭТАЛОНА (194.31.72.192)
# Это ДОПОЛНЕНИЕ к существующей конфигурации на эталоне
# Добавьте этот [Peer] блок к существующему конфигу WireGuard на .192

[Peer]
# ЗАМЕНИТЕ на публичный ключ клона (получить из приватного: echo PRIVATE_KEY | wg pubkey)
PublicKey = CLONE_PUBLIC_KEY_HERE
# Разрешаем клону только его собственный IP в туннеле
AllowedIPs = 10.0.0.2/32
# PersistentKeepalive не нужен на серверной стороне
