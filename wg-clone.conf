# WireGuard конфигурация для КЛОНА (185.244.175.90 -> туннель -> 194.31.72.192)
# Этот файл размещается в клоне после установки WireGuard
# Путь: C:\Program Files\WireGuard\Data\Configurations\wg-clone.conf

[Interface]
# ЗАМЕНИТЕ на приватный ключ клона (сгенерировать командой: wg genkey)
PrivateKey = CLONE_PRIVATE_KEY_HERE
Address = 10.0.0.2/24
DNS = 8.8.8.8, 8.8.4.4

# Таблица маршрутизации - весь трафик через туннель
# Это критично для того чтобы использовать IP эталона
Table = auto

[Peer]
# ЗАМЕНИТЕ на публичный ключ эталона .192
PublicKey = ETALON_PUBLIC_KEY_HERE
# Весь трафик (0.0.0.0/0) идет через туннель
AllowedIPs = 0.0.0.0/0
# Endpoint - сервер эталон
Endpoint = 194.31.72.192:51820
# Keepalive для поддержания соединения через NAT
PersistentKeepalive = 25
